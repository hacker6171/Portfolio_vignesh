<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 512 512">
  <defs>
    <!-- Dark circular background with subtle gradient -->
    <linearGradient id="circleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </linearGradient>

    <!-- Electric Cyan to Blue gradient for V -->
    <linearGradient id="vStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <!-- Pure White for M -->
    <linearGradient id="mStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Glowing border ring for dark and light browser tab contrast -->
    <linearGradient id="borderRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- 50% border radius / Perfect Circle (transparent outside) -->
  <circle cx="256" cy="256" r="248" fill="url(#circleBg)" stroke="url(#borderRing)" stroke-width="14"/>

  <!-- V Monogram Stroke -->
  <path d="M 80 164 L 150 348 L 220 164" 
        fill="none" 
        stroke="url(#vStroke)" 
        stroke-width="54" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- M Monogram Stroke -->
  <path d="M 292 348 L 292 164 L 364 274 L 436 164 L 436 348" 
        fill="none" 
        stroke="url(#mStroke)" 
        stroke-width="54" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
